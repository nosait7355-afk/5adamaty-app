name: Android Release APK (signed)

# يبني APK ريليز موقّع فعليًا — يتطلب الأسرار الأربعة من
# generate-release-keystore.yml مضبوطة مسبقًا في Settings > Secrets and
# variables > Actions. بلا هذه الأسرار يفشل البناء بوضوح (لا توقيع صامت).
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::السرّ RELEASE_KEYSTORE_BASE64 غير مضبوط — شغّل generate-release-keystore.yml أولًا وأضِف الأسرار الأربعة."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > khadamaty-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: khadamaty-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: khadamaty-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
