name: Generate Android Release Keystore (one-time)

# شغّل هذا يدويًا **مرة واحدة فقط**. يولّد keystore حقيقي وكلمات مرور عشوائية
# على سيرفرات GitHub (JDK متاح هناك، غير متاح محليًا في صندوق هذا المشروع)،
# ويرفعها كـartifact لتنزيلها وإضافتها كـSecrets، ثم حذف هذا الـrun بعدها.
#
# ⚠️ لا تُشغَّل هذه الخطوة مرتين لنفس التطبيق بعد نشره فعليًا — كل تشغيل
# يولّد هوية توقيع جديدة، ولا يمكن نشر تحديث لتطبيق منشور بمفتاح مختلف عن
# مفتاحه الأصلي.
on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore + random passwords
        run: |
          STORE_PASSWORD=$(openssl rand -base64 24)
          KEY_PASSWORD=$(openssl rand -base64 24)

          keytool -genkeypair -v \
            -keystore khadamaty-release.jks \
            -alias khadamaty \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Khadamaty Elfayoum, OU=App, O=Khadamaty, L=Fayoum, ST=Fayoum, C=EG"

          base64 -w0 khadamaty-release.jks > khadamaty-release.jks.base64

          {
            echo "أضِف هذه الأسرار الأربعة في: Settings -> Secrets and variables -> Actions"
            echo "ثم احذف هذا الملف وهذا الـrun فورًا — لا تتركه على جهازك أو في أي محادثة."
            echo ""
            echo "RELEASE_KEYSTORE_BASE64 = (محتوى khadamaty-release.jks.base64 كاملًا، سطر واحد)"
            echo "RELEASE_STORE_PASSWORD  = $STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS       = khadamaty"
            echo "RELEASE_KEY_PASSWORD    = $KEY_PASSWORD"
          } > SECRETS_README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: khadamaty-release-signing-secrets
          path: |
            khadamaty-release.jks.base64
            SECRETS_README.txt
          retention-days: 1
