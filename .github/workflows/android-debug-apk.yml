name: Android Debug APK

# يبني APK تطوير (بلا توقيع إنتاجي) — الغلاف يفتح WebView على رابط الإنتاج
# المنشور مباشرة (capacitor.config.ts: server.url)، فهذا البناء لا يحتاج
# `npm run build` محليًا ولا متغيرات بيئة الخادم إطلاقًا.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: khadamaty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
